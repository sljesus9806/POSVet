services:
  db:
    image: postgres:16-alpine
    container_name: posvet-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posvet}
      POSTGRES_USER: ${POSTGRES_USER:-posvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posvet_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - posvet_pg_data:/var/lib/postgresql/data
    # Flags SOLO para desarrollo local sobre btrfs. NO usar en producción:
    # desactivan durabilidad para evitar los checkpoints lentos (sync=15s).
    # Si el container crashea, basta con `npm run db:reset && npm run db:seed`.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posvet} -d ${POSTGRES_DB:-posvet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posvet_pg_data:
    name: posvet_pg_data
