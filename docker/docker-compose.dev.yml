services:
  db:
    image: postgres:16-alpine
    container_name: posvet-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posvet}
      POSTGRES_USER: ${POSTGRES_USER:-posvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posvet_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - posvet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posvet} -d ${POSTGRES_DB:-posvet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posvet_pg_data:
    name: posvet_pg_data
